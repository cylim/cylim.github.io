    <!--
      The two Latin faces the first screen draws are preloaded (design.md §3), but only on a tab's first
      page load. A later load in the same tab (a deep link, the album switch, a reload) finds them in the
      renderer's memory cache: the @font-face takes them from there straight away, so nothing swaps, and
      a static preload would go unconsumed and log "preloaded but not used" (wave-2 L7). The rest swap in
      later. With JavaScript off the stylesheet loads them as usual.
      Every script here carries data-cfasync="false": Cloudflare's Rocket Loader, on for the cy.my zone,
      would otherwise defer these pre-paint scripts and the album would paint before the walk (QM-D3).
    -->
    <script data-cfasync="false">
      ;(function () {
        try {
          if (sessionStorage.getItem('cy.fontsPreloaded')) return
          sessionStorage.setItem('cy.fontsPreloaded', '1')
        } catch (e) {}
        ;['cormorant-garamond-600', 'source-serif-4-400'].forEach(function (name) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'font'
          l.type = 'font/woff2'
          l.crossOrigin = 'anonymous'
          l.href = '/fonts/' + name + '.woff2'
          document.head.appendChild(l)
        })
      })()
    </script>

    <script type="application/ld+json">
      {

    <!--
      Render mode before first paint (stack.md §2, design.md §13.2, §14.1). The album is the CSS
      default, so no-JS visitors get it for free. The album shows when there is no WebGL2, Save-Data is
      on, deviceMemory ≤ 2, the visitor picked "Still version", or reduced motion is on without an
      opt-in; "Walk the forest" (cy.prefs mode = immersive) opts back in everywhere WebGL2 exists.
      The reason goes on <html data-static-reason> for the album banner. Keep the prefs key and shape
      in sync with src/core/boot/prefs.ts.
      A deep link into the walk starts in full paper and only emerges (design.md §6.2), so the veil goes
      up here, before the section top can paint. src/dom/bindings.ts takes the veil over and clears
      data-veil once the app runs; if it never does, the timeout lifts it so the page is never covered.
      A plain first load of the walk gets the loading screen (#intro) instead, lifted by
      src/dom/intro.ts when the forest is ready. The same failsafe applies until intro.ts claims the
      screen (data-intro="app"), so a page whose app never runs is not covered. Tests and stills skip it.
    -->
    <script data-cfasync="false">
      ;(function () {
        var d = document.documentElement
        var r = ''
        try {
          var n = navigator
          var prefs = JSON.parse(localStorage.getItem('cy.prefs') || '{}') || {}
          var optIn = prefs.mode === 'immersive'
          if (!('WebGL2RenderingContext' in window)) r = 'nowebgl'
          else if (prefs.mode === 'static') r = 'pref'
          else if (!optIn && n.connection && n.connection.saveData) r = 'saveData'
          else if (!optIn && n.deviceMemory && n.deviceMemory <= 2) r = 'memory'
          else if (!optIn && matchMedia('(prefers-reduced-motion: reduce)').matches) r = 'reduced'
          var q = new URLSearchParams(location.search).get('mode')
          if (q === 'immersive') r = ''
          else if (q === 'static') r = r || 'param'
        } catch (e) {
          r = 'error'
        }
        d.setAttribute('data-mode', r ? 'static' : 'immersive')
        if (r) d.setAttribute('data-static-reason', r)
        if (!r && /^#(cabin|grove|contact)$/.test(location.hash)) {
          d.setAttribute('data-veil', '')
          setTimeout(function () {
            d.removeAttribute('data-veil')
          }, 4000)
        } else if (!r && !/[?&](e2e|still)=/.test(location.search)) {
          d.setAttribute('data-intro', '')
          setTimeout(function () {
            if (d.getAttribute('data-intro') === '') d.removeAttribute('data-intro')
          }, 8000)
        }
      })()
    </script>
    <!--
      Album visits only: its largest paint is the first leaf's still, a lazy img (the walk prerenders
      it too, hidden, and must not download it), so preload it at high priority as soon as the mode is
      known (QM-P5). Same files and sizes as <Still id="T0" priority> (src/dom/album/Still.tsx,
      src/content/stills.ts); src/dom/album/still.test.ts keeps them in step.
    -->
    <script data-cfasync="false">
      ;(function () {
        if (document.documentElement.getAttribute('data-mode') !== 'static') return
        if (location.hash && location.hash !== '#threshold') return
        try {
          ;[
            ['(max-width: 767.98px)', '/stills/T0-portrait-800.avif', ''],
            ['(min-width: 768px)', '/stills/T0-800.avif 800w, /stills/T0-1600.avif 1600w', '(min-width: 768px) 55vw, 100vw'],
          ].forEach(function (p) {
            var l = document.createElement('link')
            l.rel = 'preload'
            l.as = 'image'
            l.type = 'image/avif'
            l.media = p[0]
            l.setAttribute('imagesrcset', p[1])
            if (p[2]) l.setAttribute('imagesizes', p[2])
            l.setAttribute('fetchpriority', 'high')
            document.head.appendChild(l)
          })
        } catch (e) {}
      })()
    </script>
    <style>
      html[data-veil] #veil {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <!-- Before #root, so a pre-paint veil (data-veil) is parsed before any content can paint. -->
    <div id="veil" aria-hidden="true"></div>
    <!-- First-load loading screen (src/dom/intro.ts, src/styles/intro.css). The label is ui.loading. -->
    <div id="intro" aria-hidden="true">
      <span class="intro-glyph"></span>
      <div class="intro-line"></div>
      <p class="intro-label">Grinding ink…</p>
    </div>
    <div id="root"><!--content--></div>
    <script type="module" src="/src/main.tsx" data-cfasync="false"></script>
  </body>
</html>
